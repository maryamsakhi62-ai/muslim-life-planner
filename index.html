<!DOCTYPE html>
<html lang="ar" dir="rtl" data-g="girl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8809B">
<meta name="description" content="مخطط الدراسة وحياة المسلم">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Life Planner">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<title>Muslim Life Planner ✨</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Aref+Ruqaa:wght@400;700&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
:root,:root[data-g=girl]{--bg:#FFF4F6;--card:#fff;--ink:#4a2f38;--soft:#9a7783;--ac:#E8809B;--acs:#FCE1E8;--ac2:#F6B8C7;--line:#f3d3db;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-g=boy]{--bg:#F0F6FD;--card:#fff;--ink:#1f3350;--soft:#6a82a0;--ac:#4C8BDA;--acs:#DCEAFA;--ac2:#9CC0EE;--line:#cfe0f4}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--bg:#2a1e23;--card:#362830;--ink:#fbe9ee;--soft:#c9a3af;--ac:#f08fa9;--acs:#4a3039;--ac2:#b5607a;--line:#4d3640}
:root[data-g=boy]:not([data-theme="light"]){--bg:#15202e;--card:#1e2d41;--ink:#e6f0fc;--soft:#93abc8;--ac:#6fa6ee;--acs:#27405e;--ac2:#3f6ea8;--line:#2d4460}}
:root[data-theme="dark"]{--bg:#2a1e23;--card:#362830;--ink:#fbe9ee;--soft:#c9a3af;--ac:#f08fa9;--acs:#4a3039;--ac2:#b5607a;--line:#4d3640}
:root[data-theme="dark"][data-g=boy]{--bg:#15202e;--card:#1e2d41;--ink:#e6f0fc;--soft:#93abc8;--ac:#6fa6ee;--acs:#27405e;--ac2:#3f6ea8;--line:#2d4460}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:'Tajawal',Tahoma,Arial,sans-serif;padding:14px 14px 100px;background-image:radial-gradient(var(--line) 1.2px,transparent 1.2px);background-size:18px 18px}
.w{max-width:640px;margin:0 auto;position:relative;z-index:1}
.bg{position:fixed;inset:0;z-index:0;opacity:.16;pointer-events:none;background-size:cover;background-position:center}
h1,h2,.hand{font-family:'Aref Ruqaa',Tajawal,cursive}
h1{font-size:1.4rem;margin:0;font-weight:700}
h2{font-size:1.05rem;margin:0 0 10px;display:inline-block;background:var(--acs);color:var(--ac);padding:4px 14px;border-radius:14px 4px 14px 4px}
.sub{color:var(--soft);font-size:.85rem}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.card{background:var(--card);border:2px dashed var(--ac2);border-radius:26px 14px 28px 12px/14px 26px 12px 28px;padding:14px 16px;margin-bottom:14px;position:relative}
.card:nth-of-type(3n+2){border-style:dotted;border-width:3px}
.tape{margin-top:20px}
.tape::before{content:"";position:absolute;top:-11px;right:28px;width:84px;height:22px;background:var(--ac2);opacity:.75;transform:rotate(-3deg);clip-path:polygon(0 0,100% 0,96% 50%,100% 100%,0 100%,4% 50%)}
button,input,select,textarea{font-family:inherit;font-size:.92rem;color:var(--ink)}
input,select,textarea{background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;width:100%}
textarea{min-height:110px;resize:vertical}
.btn{background:var(--ac);color:#fff;border:0;border-radius:14px;padding:9px 16px;font-weight:700;cursor:pointer}
.btn.g{background:var(--acs);color:var(--ac)}
.ico{background:none;border:0;cursor:pointer;font-size:1.05rem;padding:4px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>*{flex:1;min-width:70px}.row>.btn,.row>.ico{flex:0 0 auto}
.bar{height:9px;border-radius:8px;background:var(--acs);overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);border-radius:8px;transition:width .4s}
.hero{position:relative;height:220px;border-radius:30px 12px 30px 12px;overflow:hidden;margin-bottom:14px;border:3px solid var(--card);box-shadow:0 4px 14px #0003}
.hero img,.ban img{width:100%;height:100%;object-fit:cover;display:block;transition:opacity .6s}
.ov{position:absolute;inset:0;background:linear-gradient(transparent 35%,#000b);display:flex;flex-direction:column;justify-content:flex-end;padding:14px;color:#fff}
.ov b{font-size:1.3rem}
.ban{position:relative;height:110px;border-radius:24px 10px 24px 10px;overflow:hidden;margin-bottom:12px}
.ban .ov{justify-content:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:2px solid var(--ac2);border-radius:20px 8px 20px 8px;padding:12px;cursor:pointer;text-align:center}
.tile:active{transform:scale(.97)}.tile big{display:block;font-size:1.7rem}.tile small{color:var(--soft)}
.ls{display:flex;align-items:center;gap:10px;padding:10px 4px;border-top:1.5px dotted var(--line)}
.ls b{flex:1;cursor:pointer}.ls.d b{text-decoration:line-through;color:var(--soft)}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--ac);padding:0;flex:0 0 20px}
.crumb{background:none;border:0;color:var(--ac);font-weight:700;cursor:pointer;padding:4px 0;margin-bottom:6px}
.mt{border-radius:16px;background:var(--acs);padding:10px 12px;margin-bottom:8px}.mt b{display:block;margin-bottom:4px;color:var(--ac)}.mt p{margin:0;line-height:1.8;font-size:.92rem}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{border:1.5px solid var(--ac2);background:var(--card);border-radius:20px;padding:5px 12px;cursor:pointer;font-size:.85rem}.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.pi{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:14px;background:var(--acs);margin-bottom:6px}
.pi.br{background:none;border:1.5px dashed var(--line);color:var(--soft);font-size:.85rem}.pi.d{opacity:.55}.pi b{flex:1}.pi small{color:var(--soft)}
.clock{font-size:3.2rem;font-weight:900;text-align:center;color:var(--ac);direction:ltr}
.sticky{background:var(--acs);border-radius:4px;padding:14px 16px;margin-bottom:14px;transform:rotate(-1.5deg);box-shadow:2px 4px 10px #0002;line-height:1.9;font-size:1.05rem}
.gal{columns:2;gap:8px}.gal img{width:100%;border-radius:14px;margin-bottom:8px;border:3px solid var(--card);box-shadow:0 2px 8px #0002;cursor:zoom-in;display:block}
.lb{position:fixed;inset:0;background:#000d;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:12px;color:#fff}
.lb img{max-width:100%;max-height:75%;border-radius:14px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:5;background:var(--card);border-top:2px dashed var(--ac2);display:flex;justify-content:space-around;padding:6px 2px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;font-size:.7rem;color:var(--soft);padding:4px 7px;border-radius:14px;cursor:pointer}
nav button span{font-size:1.25rem}nav button.on{background:var(--acs);color:var(--ac);font-weight:700}
.gp{display:flex;gap:10px;margin:10px 0}.gp button{flex:1;padding:14px 6px;border-radius:18px;border:2px solid var(--line);background:var(--card);cursor:pointer}.gp button.on{border-color:var(--ac);background:var(--acs);font-weight:700}
[data-g=girl] .card::after{content:"🎀";position:absolute;bottom:-13px;left:16px;font-size:1.1rem}
[data-g=boy] .card::after{content:"⭐";position:absolute;bottom:-13px;left:16px;font-size:1.1rem}
.card:nth-of-type(even)::after{content:"✨"!important}
.ls input[type=text],.card input[type=time]{min-width:0}
details summary{cursor:pointer;font-weight:700;color:var(--ac)}.tp{line-height:1.9;margin:6px 0}
.toast{position:fixed;top:12px;left:12px;right:12px;z-index:30;background:var(--ac);color:#fff;padding:14px;border-radius:16px;text-align:center;font-weight:700}
.bc{width:140px;height:140px;margin:16px auto;border-radius:50%;background:var(--acs);border:3px solid var(--ac);display:grid;place-items:center;font-weight:700;color:var(--ac);animation:br 12s infinite ease-in-out}
@keyframes br{0%{transform:scale(1)}33%{transform:scale(1.5)}50%{transform:scale(1.5)}100%{transform:scale(1)}}
.tsb{width:170px;height:170px;border-radius:50%;border:6px solid var(--ac2);background:var(--acs);color:var(--ac);font-size:3rem;font-weight:900;cursor:pointer;margin:10px}.tsb:active{transform:scale(.95)}
[lang=fr] h1,[lang=fr] h2,[lang=fr] .hand{font-family:'Caveat',Tajawal,cursive}[lang=fr] h1{font-size:1.75rem}[lang=fr] h2{font-size:1.2rem}
#dp{touch-action:none;width:100%;border:2px dashed var(--line);border-radius:12px;background:#fff}
.wk{width:100%;border-collapse:collapse;font-size:.85rem}.wk th{white-space:nowrap;text-align:start;padding:6px 4px;color:var(--ac);vertical-align:top}.wk td{padding:6px 4px;border-top:1px dotted var(--line)}.cl{display:block;background:var(--acs);border-radius:8px;padding:2px 6px;margin:2px 0}
.lk{background:var(--acs);color:var(--ac);padding:4px 10px;border-radius:12px;text-decoration:none;font-weight:700}
.feed{height:72vh;overflow-y:auto;scroll-snap-type:y mandatory;border-radius:20px}.fc{height:72vh;scroll-snap-align:start;position:relative;border-radius:20px;overflow:hidden;margin-bottom:8px}.fc img{width:100%;height:100%;object-fit:cover}.fc .ov{font-size:1.3rem;line-height:1.7}
.bc{animation:none}.bc.on{animation:br 12s infinite ease-in-out}
.dt{margin:4px 0 12px;padding:6px 12px;background:var(--acs);border-radius:12px}.dt summary{cursor:pointer;font-weight:700;color:var(--ac)}.dt .tp{line-height:1.9}
</style>
</head>
